version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.17

jobs:
  build:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm test
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install firebase-tools
          command: sudo npm install -g firebase-tools@13
      - run:
          name: Deploy to Firebase Hosting
          command: >
            firebase deploy
            --only hosting
            --project "$FIREBASE_PROJECT_ID"
            --token "$FIREBASE_TOKEN"
            --non-interactive

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
